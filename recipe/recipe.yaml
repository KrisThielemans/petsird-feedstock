schema_version: 1

context:
  version: "0.12.0"

recipe:
  name: petsird
  version: ${{ version }}

build:
  number: 0
  skip:
    - win
    - osx and not arm64

outputs:
  - package:
      name: petsird
    source:
      - url: https://pypi.org/packages/source/p/petsird/petsird-${{ version }}.tar.gz
        sha256: e9a3efacd9b3c3d28b2f2885fe51c55d8a9f9a97a52a4164ae05f74a334609e0
    build:
      noarch: python
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=42
        - setuptools-scm >=3.4
        - pip
      run:
        - python >=${{ python_min }}
        - numpy >=1.22
    tests:
      - python:
          imports:
            - petsird
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: libpetsird
    source:
      - if: target_platform == "linux-64"
        then:
          url: https://github.com/ETSInitiative/PETSIRD/releases/download/v${{ version }}/petsird_v${{ version }}_linux_x86_64.tar.gz
          sha256: b5d0b4a99a060fa3fe59a561abb720ee5c2ac504c2996c60ea0c330099b61eab
      - if: target_platform == "osx-arm64"
        then:
          url: https://github.com/ETSInitiative/PETSIRD/releases/download/v${{ version }}/petsird_v${{ version }}_darwin_arm64.tar.gz
          sha256: 3221c84a2dfc58bef6929f68d0baa4fb211ce36911c108257f2c761ce63c91a5
    build:
      script: cp -R include lib $PREFIX
      files:
        - include/*
        - lib/*
    requirements:
      run:
        - hdf5>=1.12.1
        - howardhinnant_date>=3.0.1
        - nlohmann_json>=3.11.2
        - xtensor>=0.24.2
        - xtensor-blas
    tests:
      - package_contents:
          include:
            - petsird_helpers.h
            - petsird/types.h
            - petsird/protocols.h
            # self-distributed yardl (i.e. under petsird/) since there is no yardl-headers conda package (yet) to pin to instead
            - petsird/yardl/yardl.h
          files:
            - lib/cmake/PETSIRD-*/PETSIRDConfig.cmake
            - lib/cmake/PETSIRD-*/PETSIRDConfigVersion.cmake
            - lib/*petsird.* # libpetsird.a or equivalent should be present

about:
  summary: Library and tools for working with Positron Emission Tomography Standardization Initiative Raw Data (PETSIRD)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ETSInitiative/PETSIRD

extra:
  recipe-maintainers:
    - gschramm
    - KrisThielemans
    - casperdcl
